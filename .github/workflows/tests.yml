name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
      # test_passes.py only needs numpy, so the heavy audio libraries stay out
      - run: pip install numpy==1.26.4
      - run: python test_passes.py
